<section class="card" id="gibi-flip">

    <div class="doc-header">

        <span class="doc-kicker">
            LEITURA INTERATIVA
        </span>

        <h2>
            Livro Digital
        </h2>

        <p>
            Navegue pelas páginas utilizando os controles abaixo
            ou diretamente sobre o livro.
        </p>

    </div>

    <div class="gibi-viewer">

        <div id="flipbook1"></div>

        <div class="flip-controls">

            <button id="prev-page" aria-label="Página anterior">
                <i class="bi bi-chevron-left"></i>
            </button>

            <span id="page-indicator">
                Carregando...
            </span>

            <button id="next-page" aria-label="Próxima página">
                <i class="bi bi-chevron-right"></i>
            </button>

            <button id="fullscreen" aria-label="Tela cheia">
                <i class="bi bi-arrows-fullscreen"></i>
            </button>

        </div>

    </div>

</section>
